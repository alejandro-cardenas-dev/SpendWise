services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spendwise}
      POSTGRES_USER: ${POSTGRES_USER:-spendwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ stops Compose from substituting; the container's shell does it
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://${POSTGRES_USER:-spendwise}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spendwise}
    depends_on:
      db:
        condition: service_healthy # wait until Postgres accepts connections
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./Frontend
      args:
        # The BROWSER calls the API, so this is the address as seen from your
        # machine (localhost), not the internal Docker name "backend".
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata: